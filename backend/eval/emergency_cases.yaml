version: "1.0.0"
description: "AIRA emergency symptom interception test suite."

cases:
  # ER-001: Urticaria / Angioedema airway compromise
  - id: "EM-001-A"
    rule_id: "ER-001"
    text: "I developed hives and now my THROAT SWELLING is getting worse."
    should_fire: true
    expected_outcome: "EMERGENCY"

  - id: "EM-001-B"
    rule_id: "ER-001"
    text: "Sudden tongue swelling after eating peanuts, finding it hard to breathe."
    should_fire: true
    expected_outcome: "EMERGENCY"

  - id: "EM-001-C"
    rule_id: "ER-001"
    text: "lip swelling with breathing difficulty and itching all over body"
    should_fire: true
    expected_outcome: "EMERGENCY"

  - id: "EM-001-D"
    rule_id: "ER-001"
    text: "Help! mouth and throat swelling up rapidly after bee sting!!!"
    should_fire: true
    expected_outcome: "EMERGENCY"

