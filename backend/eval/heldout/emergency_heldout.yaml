# AIRA held-out emergency cases
#
# Do not tune rules against this file. Run it once after the rules are fixed.
# Cases HO-001 to HO-050: must return EMERGENCY.
# Cases HO-051 to HO-054: must return CRISIS.
# Cases HO-055 to HO-066: must return PASS (not emergency, crisis or refusal).
#
# If a case fails, report the case id and the rule ids involved. Do not edit the case.
# Once a case has been used to change a rule, retire it from this set.

