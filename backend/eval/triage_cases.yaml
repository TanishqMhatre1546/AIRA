  # 8. Dermatophytosis (Ringworm)
  - id: "TR-DERM-01"
    condition: "dermatophytosis"
    text: "Mild circular itchy red ringworm patch on inner thigh for 3 days."
    expected_level: "SEE_DOCTOR"
    note: "Dermatophytosis floor level is SEE_DOCTOR matching corpus per Section 9."

  - id: "TR-DERM-02"
    condition: "dermatophytosis"
    text: "Spreading ringworm covering large body surface for 4 weeks."
    expected_level: "SEE_DOCTOR"

  - id: "TR-DERM-03"
    condition: "dermatophytosis"
    text: "Itchy fungal patch between toes with mild skin peeling."
    expected_level: "SEE_DOCTOR"
    note: "Tinea pedis / ringworm floor level is SEE_DOCTOR; peeling without necrosis is not EMERGENCY per Section 9."

  - id: "TR-DERM-04"
    condition: "dermatophytosis"
    text: "Severe recurrent fungal rash on groin with cracked painful skin."
    expected_level: "SEE_DOCTOR"

