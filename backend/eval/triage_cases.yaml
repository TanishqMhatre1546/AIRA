version: "1.0.0"
description: "AIRA symptom triage evaluation suite covering all 15 conditions across triage levels."

cases:
  # 1. Headache
  - id: "TR-HEAD-01"
    condition: "headache"
    text: "I have a mild tension headache for 2 days after office work."
    expected_level: "SELF_CARE"

  - id: "TR-HEAD-02"
    condition: "headache"
    text: "Throbbing forehead pain for 10 days that is not going away."
    expected_level: "SEE_DOCTOR"

  - id: "TR-HEAD-03"
    condition: "headache"
    text: "Severe unbearable headache with intense nausea and light sensitivity."
    expected_level: "SEE_DOCTOR"

  - id: "TR-HEAD-04"
    condition: "headache"
    text: "Mild head pain on both sides since yesterday afternoon."
    expected_level: "SELF_CARE"

  # 2. Pharyngitis (Sore Throat)
  - id: "TR-PHAR-01"
    condition: "pharyngitis_sore_throat"
    text: "Scratchy dry sore throat for 1 day, no difficulty breathing."
    expected_level: "SELF_CARE"

  - id: "TR-PHAR-02"
    condition: "pharyngitis_sore_throat"
    text: "Throat pain lasting for 6 days with difficulty swallowing food."
    expected_level: "SEE_DOCTOR"

  - id: "TR-PHAR-03"
    condition: "pharyngitis_sore_throat"
    text: "Sore throat with fever, swollen neck glands, and white pus spots on tonsils."
    expected_level: "SEE_DOCTOR"

  - id: "TR-PHAR-04"
    condition: "pharyngitis_sore_throat"
    text: "Mild throat irritation after drinking cold water yesterday."
    expected_level: "SELF_CARE"

