    note: "Acne/single pimple without bacterial abscess is not in corpus; expected level UNKNOWN per Section 9."

  - id: "TR-SKIN-02"
    condition: "bacterial_skin_infections"
    text: "Spreading painful red skin boil on leg with pus discharge for 4 days."
    expected_level: "SEE_DOCTOR"

  - id: "TR-SKIN-03"
    condition: "bacterial_skin_infections"
    text: "Multiple painful boils spreading across thigh with fever and warmth."
    expected_level: "SEE_DOCTOR"

  - id: "TR-SKIN-04"
