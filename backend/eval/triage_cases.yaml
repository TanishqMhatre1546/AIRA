    expected_level: "SELF_CARE"

  - id: "TR-DIAR-02"
    condition: "acute_diarrhea"
    text: "Watery diarrhea lasting for 5 days with mild fever."
    expected_level: "SEE_DOCTOR"

  - id: "TR-DIAR-03"
    condition: "acute_diarrhea"
    text: "Loose stools with visible red blood in dysentery for 2 days."
    expected_level: "SEE_DOCTOR"

  - id: "TR-DIAR-04"
    condition: "acute_diarrhea"
    text: "Severe diarrhea with sunken eyes, skin pinch slow, and unable to drink."
